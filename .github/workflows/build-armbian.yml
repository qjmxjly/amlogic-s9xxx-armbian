env:
  TZ: Asia/Shanghai
  ROOTFS_SCRIPT: compile-kernel/tools/script/armbian_rootfs.sh

jobs:
  build:
    runs-on: ubuntu-22.04
    if: ${{ github.event.repository.owner.id }} == ${{ github.event.sender.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug Docker status
        run: |
          echo "=== Docker Info ==="
          docker version || echo "Docker not available"
          docker info 2>/dev/null || echo "Cannot connect to Docker daemon"
          
          echo "=== Docker Images ==="
          docker images -a
          echo "Image count: $(docker images -q | wc -l)"
          
          echo "=== Environment ==="
          echo "Runner: $RUNNER_OS"
          cat /etc/os-release 2>/dev/null | head -5
    
      - name: Initialization environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -x  # 开启详细输出

          # 检查 Docker 是否可用
          if command -v docker &> /dev/null && docker info &>/dev/null; then
              # 安全地删除镜像（处理空列表）
              IMAGES=$(docker images -q)
              if [ -n "$IMAGES" ]; then
                  echo "Deleting $(echo "$IMAGES" | wc -l) images..."
                  docker rmi $IMAGES 2>/dev/null || true
              else
                  echo "No Docker images to delete"
              fi
          else
              echo "Docker not available, skipping image cleanup"
          fi
          
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo -E apt-get -y update
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo -E apt-get -y install $(curl -fsSL https://is.gd/depend_ubuntu2204_armbian)
          sudo -E systemctl daemon-reload
          #sudo -E apt-get -y full-upgrade
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ}"
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create simulated physical disk
        run: |
          mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 1)
          root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 4)
          sudo truncate -s "${mnt_size}"G /mnt/mnt.img
          sudo truncate -s "${root_size}"G /root.img
          sudo losetup /dev/loop6 /mnt/mnt.img
          sudo losetup /dev/loop7 /root.img
          sudo pvcreate /dev/loop6
          sudo pvcreate /dev/loop7
          sudo vgcreate github /dev/loop6 /dev/loop7
          sudo lvcreate -n runner -l 100%FREE github
          sudo mkfs.xfs /dev/github/runner
          sudo mkdir -p /builder
          sudo mount /dev/github/runner /builder
          sudo chown -R runner.runner /builder
          df -Th

      - name: Download source code
        id: down
        working-directory: /builder
        if: ${{ steps.init.outputs.status }} == 'success' && !cancelled()
        run: |
          df -hT ${PWD}
          git clone -q --single-branch --depth=1 --branch=main https://github.com/armbian/build.git build
          ln -sf /builder/build ${GITHUB_WORKSPACE}/build
          ln -sf /builder/build /home/runner/work/_actions/hellotheasia/amlogic-s9xxx-armbian/main/build
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Compile Armbian [ ${{ inputs.set_release }} ]
        id: compile
        working-directory: /builder
        if: ${{ steps.down.outputs.status }} == 'success' && !cancelled()
        run: |
          # Compile method and parameter description: https://docs.armbian.com/Developer-Guide_Build-Options
          cd build/
              ./compile.sh RELEASE=${{ inputs.set_release }} BOARD=odroidn2 BRANCH=current BUILD_MINIMAL=no \
                           BUILD_ONLY=default HOST=armbian BUILD_DESKTOP=no EXPERT=yes KERNEL_CONFIGURE=no \
                           COMPRESS_OUTPUTIMAGE="sha" SHARE_LOG=yes
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Mount Armbian image (Universal)
        run: |
          IMAGE=$(ls -t build/output/images/*.img | head -1)
          echo "Image: $IMAGE"
          
          # 创建挂载点
          sudo mkdir -p /tmp/armbian-root /tmp/armbian-boot
          
          # 使用 kpartx 创建映射
          sudo kpartx -av "$IMAGE"
          sleep 2
          
          # 获取基础 loop 设备名
          LOOP_BASE=$(sudo losetup -j "$IMAGE" | head -1 | cut -d: -f1 | xargs basename)
          echo "Loop base: $LOOP_BASE"
          
          # 查找所有分区设备
          echo "Available partitions:"
          ls -la /dev/mapper/${LOOP_BASE}p* 2>/dev/null || ls -la /dev/mapper/ | grep "$LOOP_BASE"
          
          # 策略：挂载第一个找到的 Linux 分区作为 root
          # Odroid N2 通常是单分区或 p1=boot, p2=root
          
          # 尝试 p2 作为 root（标准 Armbian）
          if [ -e "/dev/mapper/${LOOP_BASE}p2" ]; then
            echo "Found p2, mounting as root..."
            sudo mount "/dev/mapper/${LOOP_BASE}p2" /tmp/armbian-root
            [ -e "/dev/mapper/${LOOP_BASE}p1" ] && sudo mount "/dev/mapper/${LOOP_BASE}p1" /tmp/armbian-boot 2>/dev/null || true
          
          # 尝试 p1 作为 root（单分区或 p1 是 root）
          elif [ -e "/dev/mapper/${LOOP_BASE}p1" ]; then
            echo "Only p1 found, checking if it's boot or root..."
            
            # 尝试挂载看内容
            sudo mount "/dev/mapper/${LOOP_BASE}p1" /tmp/armbian-root
            
            # 检查是否有 /boot 目录（区分是 root 还是 boot 分区）
            if [ -d "/tmp/armbian-root/boot" ] && [ -f "/tmp/armbian-root/etc/os-release" ]; then
              echo "p1 is the ROOT partition (single partition layout)"
              # 单分区，boot 子目录在 root 内
              sudo ln -s /tmp/armbian-root/boot /tmp/armbian-boot 2>/dev/null || true
            else
              echo "p1 appears to be BOOT partition only, unmounting..."
              sudo umount /tmp/armbian-root
              
              # 可能是 boot 分区，尝试作为 boot 挂载
              sudo mount "/dev/mapper/${LOOP_BASE}p1" /tmp/armbian-boot 2>/dev/null || true
              
              # 如果没有其他分区，直接用 boot 作为 root（特殊情况）
              sudo mount "/dev/mapper/${LOOP_BASE}p1" /tmp/armbian-root
            fi
          else
            echo "ERROR: No partitions found!"
            exit 1
          fi
          
          # 验证挂载
          echo "=== Root partition content ==="
          ls -la /tmp/armbian-root/ | head -20
          
          echo "=== Boot partition content ==="
          ls -la /tmp/armbian-boot/ 2>/dev/null | head -10 || echo "No separate boot"
          
          # 检查是否有 /etc 目录确认是 root
          if [ ! -d "/tmp/armbian-root/etc" ]; then
            echo "ERROR: /etc not found, this doesn't look like a root filesystem!"
            exit 1
          fi
          
          # ========== 注入 WiFi 配置 ==========
          
          # 方法 1: 使用 armbian_first_run.txt (推荐，因为可以放在 boot 分区)
          if mountpoint /tmp/armbian-boot > /dev/null 2>&1 || [ -d "/tmp/armbian-root/boot" ]; then
            BOOT_DIR="/tmp/armbian-boot"
            # 如果是单分区，boot 是子目录
            [ -d "/tmp/armbian-root/boot" ] && BOOT_DIR="/tmp/armbian-root/boot"
            
            echo "Creating armbian_first_run.txt in $BOOT_DIR..."
            sudo tee "${BOOT_DIR}/armbian_first_run.txt" > /dev/null << 'EOF'
          FR_general_delete_this_file_after_completion=1
          FR_net_change_defaults=1
          FR_net_wifi_enabled=1
          FR_net_wifi_ssid='youxun'
          FR_net_wifi_key='youxun888'
          FR_net_wifi_countrycode='CN'
          FR_net_use_static=0
          EOF
            echo "Created armbian_first_run.txt"
            cat "${BOOT_DIR}/armbian_first_run.txt"
          fi
          
          # 方法 2: 同时创建 .not_logged_in_yet 在 root 分区（双重保险）
          sudo mkdir -p /tmp/armbian-root/root
          sudo tee /tmp/armbian-root/root/.not_logged_in_yet > /dev/null << 'EOF'
          PRESET_NET_CHANGE_DEFAULTS="1"
          PRESET_NET_WIFI_ENABLED="1"
          PRESET_NET_WIFI_SSID="youxun"
          PRESET_NET_WIFI_KEY="youxun888"
          PRESET_NET_WIFI_COUNTRYCODE="CN"
          PRESET_CONNECT_WIRELESS="n"
          PRESET_ROOT_PASSWORD="123456"
          SET_LANG_BASED_ON_LOCATION="n"
          PRESET_LOCALE="en_US.UTF-8"
          PRESET_TIMEZONE="Asia/Shanghai"
          PRESET_USER_NAME="ros"
          PRESET_USER_PASSWORD="123456"
          PRESET_DEFAULT_REALNAME="Armbian User"
          PRESET_USER_SHELL="bash"
          EOF
          
          echo "Created .not_logged_in_yet"
          
          # 清理卸载（修复版）
          echo "Cleaning up..."
          
          # 1. 先卸载 boot（如果是挂载点）
          if mountpoint /tmp/armbian-boot > /dev/null 2>&1; then
              sudo umount /tmp/armbian-boot 2>/dev/null || true
          fi
          
          # 2. 删除符号链接（如果是 symlink）
          if [ -L "/tmp/armbian-boot/boot" ]; then
              sudo rm -f /tmp/armbian-boot/boot 2>/dev/null || true
          fi
          
          # 3. 卸载 root 分区
          if mountpoint /tmp/armbian-root > /dev/null 2>&1; then
              sudo umount /tmp/armbian-root || {
                  echo "Force unmounting..."
                  sudo umount -l /tmp/armbian-root 2>/dev/null || true
              }
          fi
          
          # 4. 移除 loop 设备映射
          sudo kpartx -d "$IMAGE" 2>/dev/null || true
          sudo losetup -D 2>/dev/null || true
          
          # 5. 等待设备释放
          sleep 1
          
          # 6. 删除目录（现在应该可以了）
          sudo rm -rf /tmp/armbian-boot /tmp/armbian-root 2>/dev/null || {
              echo "Warning: Could not remove directories, but they will be cleaned by OS later"
          }
          
          echo "Cleanup completed"

          
      - name: Organize files and clear space
        id: clean
        if: ${{ steps.compile.outputs.status }} == 'success' && !cancelled()
        run: |
          # Organize and keep essential files, delete unnecessary files
          chmod +x ${ROOTFS_SCRIPT}
          ${ROOTFS_SCRIPT} -v ${{ inputs.set_release }}

          # Output cleaning result information
          df -hT ${PWD}
          echo "build_tag=Armbian_${{ inputs.set_release }}_${{ inputs.armbian_storage }}_$(date +"%Y.%m")" >> ${GITHUB_OUTPUT}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Upload Armbian image to Release
        uses: ncipollo/release-action@main
        if: ${{ steps.clean.outputs.status }} == 'success' && !cancelled()
        with:
          tag: ${{ steps.clean.outputs.build_tag }}
          artifacts: build/output/images/*
          allowUpdates: true
          token: ${{ secrets.GH_TOKEN}}

      - name: Rebuild Armbian
        uses: qjmxjly/amlogic-s9xxx-armbian@main
        if: ${{ steps.clean.outputs.status }} == 'success' && !cancelled()
        with:
          build_target: armbian
          armbian_path: build/output/images/*.img.gz
          armbian_board: ${{ inputs.armbian_board }}
          armbian_kernel: ${{ inputs.armbian_kernel }}
          auto_kernel: ${{ inputs.auto_kernel }}
          kernel_repo: ${{ inputs.kernel_repo }}
          kernel_usage: ${{ inputs.kernel_usage }}
          armbian_fstype: ${{ inputs.armbian_fstype }}
          builder_name: ${{ inputs.builder_name }}

      - name: Upload Rebuild image to Release
        uses: ncipollo/release-action@main
        if: ${{ env.PACKAGED_STATUS }} == 'success' && !cancelled()
        with:
          tag: ${{ steps.clean.outputs.build_tag }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          token: ${{ secrets.GH_TOKEN }}
          body: |
            ### Armbian Image information
            - Default username: root
            - Default password: 1234
            - Install command: armbian-install
            - Update command: armbian-update
            ### Armbian Image Verification
            - sha256sum
